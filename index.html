<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bulk Robots & Sitemap Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="favicon.png" rel="shortcut icon" type="image/x-icon">
<style> 
:root {
  --bg: radial-gradient(circle at top, #1b1b1b, #000);
  --text: #ffffff;
  --card: #161616;
  --panel: #0e0e0e;
  --border: #333;
  --muted: #bbb;
  --badge-bg: #2b2b2b;
  --badge-border: #444;
  --link: #4dabf7;
}

body.light {
  --bg: #f5f7fb;
  --text: #111;
  --card: #ffffff;
  --panel: #ffffff;
  --border: #d9dee5;
  --muted: #5c6672;
  --badge-bg: #eef2f7;
  --badge-border: #d9dee5;
  --link: #0d6efd;
}

* {
  box-sizing: border-box;
  font-family: system-ui, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  display: flex;
  justify-content: center;
  padding: 30px;
}

.container {
  width: 100%;
  max-width: 1400px;
}

/* ---------- HEADER ---------- */

.header {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
}

.theme-toggle {
  position: absolute;
  right: 0;
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}

.theme-toggle:hover {
  opacity: 0.85;
}

/* ---------- INPUT ---------- */

textarea {
  width: 100%;
  height: 160px;
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 15px;
  font-size: 14px;
}

/* ---------- BUTTON ---------- */

button {
  margin: 20px auto;
  display: block;
  padding: 14px 28px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  background: #0d6efd;
  color: #fff;
}

button:hover {
  background: #0b5ed7;
}

/* ---------- CARD ---------- */

.site-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.site-box h2 {
  font-size: 18px;
  color: var(--link);

  margin: 0 0 15px;
  word-break: break-all;
}

/* ---------- PANELS ---------- */

.flex {
  display: flex;
  gap: 15px;
}

.panel {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.panel h3 {
  margin: 0;
  padding: 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  color: var(--muted);
}

/* ---------- CONTENT ---------- */

iframe {
  width: 100%;
  height: 260px;
  border: none;
  background: #fff;
}

pre {
  margin: 0;
  padding: 12px;
  height: 260px;
  overflow: auto;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  background: transparent;
}

.error {
  color: #ff6b6b;
}

/* ---------- GRID ---------- */

.results-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
}

@media (max-width: 900px) {
  .flex {
    flex-direction: column;
  }
  .results-grid {
    grid-template-columns: 1fr;
  }
}

/* ---------- NA BADGE ---------- */

.na-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 260px;
}

.na-badge {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--badge-bg);
  border: 1px solid var(--badge-border);
  color: var(--muted);
  font-size: 25px;
  text-align: center;
}


.redirect-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 4px 8px;
  font-size: 11px;
  border-radius: 6px;
  background: #0d6efd22;
  border: 1px solid #0d6efd55;
  color: #0d6efd;
}
.xml-viewer {
  width: 100%;
  height: 260px;
  border: none;
  background: #fff;
}
</style>
</head>

<body>
<div class="container">
	<div class="header">
	  <h1>Bulk Robots & Sitemap Viewer</h1>
	  <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
	</div>
  <textarea id="urls" placeholder="Enter URLs (one per line)"></textarea>
  <button id="openBtn">Open All</button>

  <div id="results" class="results-grid"></div>
</div>

<script>
function normalizeUrl(url) {
  url = url.trim();
  if (!url) return null;

  if (!/^https?:\/\//i.test(url)) {
    url = 'https://' + url;
  }

  try {
    const u = new URL(url);
    return {
      display: url.replace(/\/+$/, ''),
      origin: u.origin
    };
  } catch {
    return null;
  }
}

document.getElementById('openBtn').addEventListener('click', () => {
  const input = document.getElementById('urls').value;
  const sites = input.split('\n').map(normalizeUrl).filter(Boolean);
  const results = document.getElementById('results');

  results.innerHTML = '';

  if (!sites.length) {
    alert('Please enter at least one website.');
    return;
  }

  sites.forEach(site => {
    const displayUrl = site.display;
    const origin = site.origin;

    const hostname = new URL(origin).hostname;
    const isCloudflarePages = hostname.endsWith('.pages.dev');
    const isCloudflareR2 = hostname.endsWith('.r2.dev');
    const skip = isCloudflarePages || isCloudflareR2;

    const box = document.createElement('div');
    box.className = 'site-box';

    if (skip) {
      box.innerHTML = `
        <h2>${displayUrl}</h2>
        <div class="panel na-panel">
          <div class="na-badge">Not applicable for Pages/R2 domains</div>
        </div>
      `;
      results.appendChild(box);
      return;
    }

    box.innerHTML = `
      <h2>${displayUrl}</h2>
      <div class="flex">
        <div class="panel">
          <h3>robots.txt</h3>
          <iframe src="${origin}/robots.txt"></iframe>
        </div>
        <div class="panel">
          <h3>sitemap.xml</h3>
          <pre>Loading sitemap…</pre>
        </div>
      </div>
    `;

    results.appendChild(box);

    const pre = box.querySelector('pre');

   fetch('/.netlify/functions/sitemap?url=' + encodeURIComponent(origin + '/sitemap.xml'))
  .then(async r => {
    const text = await r.text();
    const redirect = r.headers.get('X-Redirect-Domain') === '1';

    if (redirect) {
      box.innerHTML = `
        <h2>${displayUrl}</h2>
        <div class="panel na-panel">
          <div class="na-badge">301 Domain</div>
        </div>
      `;
      return;
    }

    box.innerHTML = `
      <h2>${displayUrl}</h2>
      <div class="flex">
        <div class="panel">
          <h3>robots.txt</h3>
          <iframe src="${origin}/robots.txt"></iframe>
        </div>
        <div class="panel">
          <h3>sitemap.xml</h3>
          <pre></pre>
        </div>
      </div>
    `;

    const pre = box.querySelector('pre');
    pre.textContent = text;
  })
  .catch(() => {
    box.innerHTML = `
      <h2>${displayUrl}</h2>
      <div class="panel na-panel">
        <div class="na-badge">Unable to load sitemap</div>
      </div>
    `;
  });
  });
});

</script>
</body>
</html>
