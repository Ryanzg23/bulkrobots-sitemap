<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Bulk Robots & Sitemap Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="favicon.png" rel="shortcut icon" type="image/x-icon">
<style>
	:root {
	  --bg: radial-gradient(circle at top, #1b1b1b, #000);
	  --text: #fff;
	  --card: #161616;
	  --panel: #0e0e0e;
	  --border: #333;
	  --muted: #bbb;
	  --badge-bg: #2b2b2b;
	  --badge-border: #444;
	}
	
	body.light {
	  --bg: #f5f6f8;
	  --text: #111;
	  --card: #ffffff;
	  --panel: #f1f3f5;
	  --border: #d0d4da;
	  --muted: #555;
	  --badge-bg: #e9ecef;
	  --badge-border: #d0d4da;
	}
	* {
	  box-sizing: border-box;
	  font-family: system-ui, sans-serif;
	}

	body {
	  margin: 0;
	  min-height: 100vh;
	  background: var(--bg);
	  color: var(--text);
	  display: flex;
	  justify-content: center;
	  padding: 30px;
	}
	
	textarea {
	  background: var(--panel);
	  color: var(--text);
	  border: 1px solid var(--border);
	}
	
	.site-box {
	  background: var(--card);
	  border: 1px solid var(--border);
	}
	
	.panel {
	  background: var(--panel);
	  border: 1px solid var(--border);
	}
	
	.panel h3 {
	  background: var(--panel);
	  border-bottom: 1px solid var(--border);
	  color: var(--muted);
	}
	
	.na-badge {
	  background: var(--badge-bg);
	  border: 1px solid var(--badge-border);
	  color: var(--muted);
	}


.container {
  width: 100%;
  max-width: 1400px;
  position: relative;
}

h1 {
  text-align: center;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 160px;
  background: #222;
  color: #ddd;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 15px;
  font-size: 14px;
}

button {
  margin: 20px auto;
  display: block;
  padding: 14px 28px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  background: #0d6efd;
  color: #fff;
}

button:hover {
  background: #0b5ed7;
}

.site-box {
  background: #161616;
  border: 1px solid #222;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 25px;
}

.site-box h2 {
  font-size: 18px;
  color: #4dabf7;
  margin-bottom: 15px;
  word-break: break-all;
}

.flex {
  display: flex;
  gap: 15px;
}

.panel {
  flex: 1;
  background: #0e0e0e;
  border: 1px solid #333;
  border-radius: 8px;
  overflow: hidden;
}

.panel h3 {
  margin: 0;
  padding: 10px;
  background: #111;
  border-bottom: 1px solid #333;
  font-size: 14px;
  color: #bbb;
}

iframe {
  width: 100%;
  height: 260px;
  border: none;
}

pre {
  margin: 0;
  padding: 12px;
  height: 260px;
  overflow: auto;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-word;
}

.error {
  color: #ff6b6b;
}
.results-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 25px;
}

@media (max-width: 900px) {
  .flex {
    flex-direction: column;
  }
	
  .results-grid {
    grid-template-columns: 1fr;
  }
}
	.na-panel {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 260px;
}

.na-badge {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 999px;
  background: #2b2b2b;
  border: 1px solid #444;
  color: #bbb;
  font-size: 12px;
  text-align: center;
}
.theme-toggle {
  position: absolute;
  top: 30px;
  right: 30px;
  padding: 8px 14px;
  font-size: 13px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
}

.theme-toggle:hover {
  opacity: 0.85;
}
</style>
</head>

<body>
<div class="container">
  <h1>Bulk Robots & Sitemap Viewer</h1>
 <button id="themeToggle" class="theme-toggle">🌙 Dark</button>

  <textarea id="urls" placeholder="Enter URLs (one per line)"></textarea>
  <button id="openBtn">Open All</button>

  <div id="results" class="results-grid"></div>
</div>

<script>
function normalizeUrl(url) {
  url = url.trim();
  if (!url) return null;

  if (!/^https?:\/\//i.test(url)) {
    url = 'https://' + url;
  }

  try {
    const u = new URL(url);
    return {
      display: url.replace(/\/+$/, ''), // keep subfolders
      origin: u.origin                 // root for robots/sitemap
    };
  } catch {
    return null;
  }
}

document.getElementById('openBtn').addEventListener('click', () => {
  const input = document.getElementById('urls').value;
  const sites = input.split('\n').map(normalizeUrl).filter(Boolean);
  const results = document.getElementById('results');

  results.innerHTML = '';

  if (!sites.length) {
    alert('Please enter at least one website.');
    return;
  }

  sites.forEach(site => {
	const displayUrl = site.display;
	const origin = site.origin;
	const hostname = new URL(origin).hostname;
	const isCloudflarePages = hostname.endsWith('.pages.dev');
	const isCloudflareR2 = hostname.endsWith('.r2.dev');
	const skipRobotsSitemap = isCloudflarePages || isCloudflareR2;
    const box = document.createElement('div');
    box.className = 'site-box';

   if (skipRobotsSitemap) {
	  box.innerHTML = `
	    <h2>${displayUrl}</h2>
	    <div class="panel na-panel">
	      <div class="na-badge">Not applicable for Pages/R2 domain</div>
	    </div>
	  `;
	} else {
	  box.innerHTML = `
	    <h2>${displayUrl}</h2>
	    <div class="flex">
	      <div class="panel">
	        <h3>robots.txt</h3>
	        <iframe src="${origin}/robots.txt"></iframe>
	      </div>
	      <div class="panel">
	        <h3>sitemap.xml</h3>
	        <pre>Loading sitemap…</pre>
	      </div>
	    </div>
	  `;
	}

    results.appendChild(box);

    const pre = box.querySelector('pre');

    if (!skipRobotsSitemap) {
	  const pre = box.querySelector('pre');
	
	  fetch('/.netlify/functions/sitemap?url=' + encodeURIComponent(origin + '/sitemap.xml'))
	    .then(r => r.ok ? r.text() : Promise.reject())
	    .then(text => pre.textContent = text)
	    .catch(() => {
	      pre.innerHTML =
	        '<span class="error">Unable to load sitemap.</span><br>' +
	        `<a href="${origin}/sitemap.xml" target="_blank">Open in new tab</a>`;
	    });
	}
  });
});
</script>
</body>
</html>
